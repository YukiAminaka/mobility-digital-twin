name: Deploy
on: 
  workflow_dispatch:
  # push:
  #   branches: ["main"]
  #   paths:
  #     - "cmd/**"
  #     - "internal/**"
  #     - "Dockerfile"
  #     - "go.mod"
  #     - "go.sum"
  #     - ".github/workflows/deploy.yml"
  #     - ".github/actions/**"
  # pull_request:
  #   branches: ["main"]
  #   paths:
  #     - "cmd/**"
  #     - "internal/**"
  #     - "Dockerfile"
  #     - "go.mod"
  #     - "go.sum"
  #     - ".github/workflows/deploy.yml"
  #     - ".github/actions/**"
env:
  ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ID }}:role/${{ secrets.ROLE_NAME }}
  SESSION_NAME: gh-oidc-${{ github.run_id }}-${{ github.run_attempt }}

concurrency: # 多重実行の防止
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # PRのみキャンセル可

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7 # チェックアウト
      - uses: aws-actions/configure-aws-credentials@v6.2.3 # 一時クレデンシャルの取得
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ${{ env.SESSION_NAME }}
          aws-region: ap-northeast-1
      - uses: ./.github/actions/container-build/ # コンテナイメージのビルド
        id: build
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' # mainブランチへのPRまたはmainブランチへのpush時のみ実行
        with:
          ecr-repository-uri: ${{ vars.ECR_REPOSITORY_URI }}
          dockerfile-path: .
      - uses: ./.github/actions/container-deploy/ # コンテナのデプロイ
        if: github.ref == 'refs/heads/main' # mainブランチへのpush時のみ実行
        with:
          ecs-cluster: ${{ vars.ECS_CLUSTER_NAME }}
          ecs-service: ${{ vars.ECS_SERVICE_NAME }}
          task-definition: ${{ vars.TASK_DEFINITION_NAME }}
          container-name: ${{ vars.CONTAINER_NAME }}
          container-image: ${{ steps.build.outputs.container-image }}
