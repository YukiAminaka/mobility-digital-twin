name: Deploy
on: 
  workflow_dispatch:
  # push:
  #   branches: ["main"]
  #   paths:
  #     - "cmd/**"
  #     - "internal/**"
  #     - "Dockerfile"
  #     - "go.mod"
  #     - "go.sum"
  #     - ".github/workflows/deploy.yml"
  #     - ".github/actions/**"
  # pull_request:
  #   branches: ["main"]
  #   paths:
  #     - "cmd/**"
  #     - "internal/**"
  #     - "Dockerfile"
  #     - "go.mod"
  #     - "go.sum"
  #     - ".github/workflows/deploy.yml"
  #     - ".github/actions/**"
env:
  ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ID }}:role/${{ secrets.ROLE_NAME }}
  SESSION_NAME: gh-oidc-${{ github.run_id }}-${{ github.run_attempt }}

concurrency: # 多重実行の防止
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # PRのみキャンセル可

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v6.2.3 # 一時クレデンシャルの取得
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ${{ env.SESSION_NAME }}
          aws-region: ap-northeast-1
      - name: コンテナイメージのビルド
        uses: $/.github/actions/container-build/
        id: build
        if: (github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main' # mainブランチへのPRまたはmainブランチへのpush時のみ実行
        with:
          ecr-repository-uri: ${{ vars.ECR_REPOSITORY_URI }}
          dockerfile-path: .
      - name: ECSサービスの存在確認
        id: describe
        # env/devをdestroyしている間はクラスターやDescribeServicesの権限が無くエラーになるため、エラーも「存在しない」とみなす
        run: |
          count=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" \
            --query "length(services[?status=='ACTIVE'])" --output text 2>/dev/null || echo 0)
          echo "exists=$([ "${count}" = "1" ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE_NAME }}
      - name: コンテナのデプロイ
        uses: $/.github/actions/container-deploy/
        if: github.ref == 'refs/heads/main' && steps.describe.outputs.exists == 'true' # mainブランチへのpush時かつECSサービスが存在する時のみ実行
        with:
          ecs-cluster: ${{ vars.ECS_CLUSTER_NAME }}
          ecs-service: ${{ vars.ECS_SERVICE_NAME }}
          task-definition: ${{ vars.TASK_DEFINITION_NAME }}
          container-name: ${{ vars.CONTAINER_NAME }}
          container-image: ${{ steps.build.outputs.container-image }}
